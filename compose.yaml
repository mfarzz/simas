version: "1.0"

services:
  app:
    build:
      context: .
    container_name: be-simas
    ports:
      - "5000:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - ./.env2:/var/www/html/.env
      - ./storage:/var/www/html/storage
      - /var/www/html/bootstrap/cache
    depends_on:
      - db
    environment:
      APP_ENV: local
      APP_DEBUG: true
    command: >
      sh -c "chown -R www-data:www-data storage && apache2-foreground"

  db:
    image: postgres:16
    container_name: db-simas
    restart: always
    environment:
      POSTGRES_DB: simas
      POSTGRES_USER: simas
      POSTGRES_PASSWORD: "Simas2023##"
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "55432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
